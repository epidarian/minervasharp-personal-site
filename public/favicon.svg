<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1030"/>
      <stop offset="1" stop-color="#3a2250"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="80%" r="60%">
      <stop offset="0" stop-color="#ff7aa8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff7aa8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#sky)"/>
  <rect width="64" height="64" rx="12" fill="url(#glow)"/>
  <!-- skyline -->
  <g fill="#120b26">
    <rect x="6" y="34" width="10" height="24"/>
    <rect x="18" y="26" width="12" height="32"/>
    <rect x="32" y="38" width="8" height="20"/>
    <rect x="42" y="22" width="14" height="36"/>
  </g>
  <!-- lit windows -->
  <g fill="#ffc766">
    <rect x="21" y="30" width="3" height="3"/>
    <rect x="26" y="30" width="3" height="3"/>
    <rect x="21" y="37" width="3" height="3"/>
    <rect x="46" y="27" width="3" height="3"/>
    <rect x="51" y="27" width="3" height="3"/>
    <rect x="46" y="34" width="3" height="3"/>
  </g>
  <!-- street lamp glow -->
  <circle cx="10" cy="30" r="4" fill="#bfe0ff"/>
</svg>
